# Example strategy instance configuration (design.md §5.3.1).
#
# DEC-011: the first enabled strategy, universe, schedule, and parameters are
#          an owner decision. Until accepted, no strategy instance is enabled.
# YAML must not contain eval, lambda, or other executable expressions.
#
# Copy to an untracked file (for example config/strategies.yaml). Keep
# enabled: false until DEC-011 is accepted. Do not commit production
# parameters as if they were owner-approved.
#
# Live mode additionally requires plugin_version pins matching the discovered
# plugin package version (see StrategyRegistry allowlists).

schema_version: "1"

strategies:
  - id: aapl_sma_daily
    plugin: moving_average
    strategy: moving_average
    # Optional pin; required when TRADING_MODE=live.
    # plugin_version: "1.0.0"
    # Owner must explicitly enable after DEC-011 acceptance.
    enabled: false
    universe:
      symbols: [AAPL, MSFT]
      timeframe: 1d
    parameters:
      fast_window: 20
      slow_window: 50
      target_weight: "0.10"
    schedule:
      run_at: market_close_minus_15m
    constraints:
      research_max_age: 30m
      signal_ttl: 30m
