[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ainvest"
version = "0.1.0"
description = "AI-assisted investment research and controlled trade execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "apscheduler>=3.11,<3.12",
    "pluggy>=1.5,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "structlog>=25,<26",
    "transitions>=0.9,<1",
]

[project.optional-dependencies]
research = [
    "edgartools>=5.45.0,<6",
    "httpx>=0.28,<1",
    "pandas-market-calendars>=5,<6",
    "pydantic-ai-slim[openai]>=1,<2",
]
offline-data = [
    "yfinance>=0.2.65,<1",
]
approval = [
    "fastapi>=0.141.1,<1",
    "python-telegram-bot>=22,<23",
    "uvicorn[standard]>=0.52.1,<1",
    "webauthn>=2.6,<3",
]
broker = [
    # The independently reviewed, artifact-pinned rh-mcp release. A PEP 508
    # direct reference rather than a version specifier, and both halves of it
    # are security properties rather than packaging taste:
    #
    #  * `rh-mcp` is not published on PyPI. A `rh-mcp==0.3.0` specifier would
    #    resolve against the public index, where that name is unregistered and
    #    therefore claimable by anyone — textbook dependency confusion. Naming
    #    the release asset takes the index out of the trust path entirely.
    #  * pip enforces the `#sha256=` fragment and refuses a download that does
    #    not hash to it. uv ignores the fragment, so `uv lock --check` cannot
    #    catch a corrupted one; `tests/unit/test_dependency_boundary.py` binds
    #    it to `pins.PINNED_WHEEL_SHA256` and to `uv.lock` instead.
    #
    # Both values come from the "Current executable dependency pin" subsection
    # of `docs/tasks/status.md` by way of
    # `ainvest.execution.robinhood.pins`, which stays the single authority.
    #
    # ainvest still does not depend on or import the MCP SDK. `mcp` and
    # `httpx2` arrive only as rh-mcp's own private transitive dependencies;
    # no `ainvest.*` module imports either, which is asserted by test.
    "rh-mcp @ https://github.com/likefudan/rh-mcp/releases/download/v0.3.0/rh_mcp-0.3.0-py3-none-any.whl#sha256=1dbd512c51e6bc0f5a90626d5a562ca4d79f3b6c5cb1ee24be9c1af24045b76e",
]
observability = [
    "opentelemetry-api>=1.32,<2",
    "opentelemetry-sdk>=1.32,<2",
    "prometheus-client>=0.22,<1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.2,<5",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0.12,<7",
]
test = [
    "hypothesis>=6.165.0,<7",
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.26,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
    "types-jsonschema>=4.26,<5",
]

[tool.uv]
default-groups = ["dev", "test"]

[project.scripts]
ainvest-strategy-conformance = "ainvest.strategy_conformance.cli:main"
ainvest-paper-flow = "ainvest.orchestrator.cli:main"
ainvest-robinhood-read = "ainvest.execution.robinhood.cli:main"
ainvest-telegram-provision = "ainvest.approval.telegram_provisioning:main"

[project.entry-points."ainvest.strategies"]
moving_average = "ainvest.strategies.reference.moving_average.plugin:plugin"

[tool.hatch.metadata]
# Needed for the one direct reference in the `broker` extra. Hatchling refuses
# direct references by default and that default is a good one, so
# `tests/unit/test_dependency_boundary.py` re-imposes it as an allowlist of
# exactly one URL: this switch cannot quietly admit a second.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ainvest"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]
pythonpath = ["tests/unit"]
markers = [
    "unit: fast tests isolated from external processes and services",
    "contract: public interface and provider contract tests",
    "integration: tests spanning multiple components or process boundaries",
    "live_safety: required live-trading safety gates; must run in CI and cannot use skip/skipif",
]

[tool.coverage.run]
branch = true
source = ["ainvest"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"examples/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["tests/unit"]
warn_unreachable = true
exclude = [
    "(^|/)conftest\\.py$",
]
